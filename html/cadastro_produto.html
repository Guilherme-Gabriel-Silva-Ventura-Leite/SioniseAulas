<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro de produtos</title>
</head>
<body>
    <h1>cadastro de produtos</h1>
    <form>
        <label for="produto">Produto:</label>
        <input type="text" name="produto" id="produto" required placeholder="preencha">
        <br>

        <label for="descricao">Descrição:</label>
        <input type="text" name="descricao" id="descricao" required placeholder="Preencha">
        <br>

        <label for="cor">Cor:</label>
        <input type="color" name="cor" id="cor" required placeholder="Preencha">
        <br>

        <label for="marca">Marca:</label>
        <input type="text" name="marca" id="marca" required placeholder="Preencha">
        <br>

        <label for="tamanho">Tamanho:</label>
        <input type="text" name="tamanho" id="tamanho" required placeholder="Preencha">
        <br>

        <label for="quantidade">Produto:</label>
        <input type="number" name="quantidade" id="quantidade" required placeholder="Preencha">
        <br>

        <label for="preco investido">Preço investido:</label>
        <input type="number" name="preco investido" id="preco investido" required placeholder="Preencha">
        <br>

        <label for="preco justo">Preço Justo:</label>
        <input type="number" name="preco justo" id="preco justo" required placeholder="Preencha">
        <br>

        <label for="preco venda">Preço Venda:</label>
        <input type="number" name="preco venda" id="preco venda" required placeholder="Preencha">
        <br>

        <label for="observacao">Observação:</label>
        <input type="text" name="observacao" id="observacao" required placeholder="Preencha">
        <br>

        <label for="foto do produto">Foto do produto:</label>
        <input type="file" name="foto do produto" id="foto do produto" required placeholder="Preencha">
        <br>
        <br>
    <input type="submit">
    </form>
</body>
</html>
