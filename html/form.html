<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="form.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <h1>formulario</h1>

    <form>
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome" required placeholder="Preencha seu nome completo">
        <br>
        <label for="cpf">CPF:</label>
        <input type="text" name="CPF" id="cpf" required placeholder="Preencha seu CPF completo">
        <br>
        <label for="email">email:</label>
        <input type="text" name="EMAIL" id="email" required placeholder="Preencha seu email completo">
        <br>
        <label for="senha">senha:</label>
        <input type="text" name="SENHA" id="senha" required placeholder="coloque a senha">
        <br>
        <br>
        <input type="submit">
    



    </form>
</body>
</html>
