<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de armas de Free Fire</title>
</head>
<body>

    <h1>Loja de armas de Free Fire</h1>
    <h2>Compra certa é aqui mlk</h2>

    <form>

        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome" required placeholder="Preencha seu nome completo">
        <br>

        <label for="cpf">CPF:</label>
        <input type="text" name="cpf" id="cpf" required placeholder="Preencha seu CPF completo">
        <br>

        <label for="rua">Rua:</label>
        <input type="text" name="rua" id="rua" required placeholder="Digite a rua, avenida, beco">
        <br>

        <label for="numero">Número:</label>
        <input type="text" name="numero" id="numero" required placeholder="Digite o número da casa">
        <br>

        <label for="bairro">Bairro:</label>
        <input type="text" name="bairro" id="bairro" required placeholder="Qual seu bairro?">
        <br>

        <label for="complemento">Complemento:</label>
        <input type="text" name="complemento" id="complemento" placeholder="Ex.: Apto">
        <br>

        <label for="referencia">Ponto de referência:</label>
        <input type="text" name="referencia" id="referencia" required placeholder="Informe um ponto de referência">
        <br>

        <label for="telefone">Telefone:</label>
        <input type="tel" name="telefone" id="telefone" placeholder="(xx) xxxx-xxxx">
        <br>

        <label for="nascimento">Data de nascimento:</label>
        <input type="date" name="nascimento" id="nascimento">
        <br>

    </form>

</body>
</html>
